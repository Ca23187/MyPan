#  NOTE: 部署时记得反向代理（Nginx）缓冲了 SSE，需要关 buffering
server:
  port: 7090
  servlet:
    context-path: /api
  forward-headers-strategy: native

spring:
  devtools:
    restart:
      enabled: true
  application:
    name: mypan
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB
  web:
    resources:
      add-mappings: false

  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/mypan?serverTimezone=Europe%2FAmsterdam&useUnicode=true&characterEncoding=utf8&allowMultiQueries=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: HikariCPDatasource
      minimum-idle: 5
      idle-timeout: 180000
      maximum-pool-size: 10
      auto-commit: true
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  jpa:
    properties:
      hibernate:
        format_sql: true

  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  data:
    redis:
      database: ${REDIS_DATABASE:0}
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000
      lettuce:
        pool:
          max-active: 20
          max-wait: -1
          max-idle: 10
          min-idle: 0

logging:
  file:
    path: ./logs
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

app:
  project-folder: ${APP_PROJECT_FOLDER:d:/mypan}
  dev: ${APP_DEV:true}
  admin-ids:
    - ${APP_ADMIN_ID:}
  mail:
    from: ${APP_MAIL_FROM:}
  qq:
    app-id: ${QQ_APP_ID:}
    app-key: ${QQ_APP_KEY:}
    url-authorization: "https://graph.qq.com/oauth2.0/authorize?response_type=code&client_id=%s&redirect_uri=%s&state=%s"
    url-access-token: "https://graph.qq.com/oauth2.0/token?grant_type=authorization_code&client_id=%s&client_secret=%s&code=%s&redirect_uri=%s"
    url-openid: "https://graph.qq.com/oauth2.0/me?access_token=%S"
    url-user-info: "https://graph.qq.com/user/get_user_info?access_token=%s&oauth_consumer_key=%s&openid=%s"
    url-redirect: ${QQ_URL_REDIRECT:}

jwt:
  secret: ${JWT_SECRET:}
  expire-millis: ${JWT_EXPIRE_MILLIS:7200000}
  issuer: ${JWT_ISSUER:mypan-service}
  subject: ${JWT_SUBJECT:USER_INFO}
  clock-skew-seconds: ${JWT_CLOCK_SKEW_SECONDS:60}

session:
  ttl-millis: ${SESSION_TTL_MILLIS:604800000}
  renew-threshold-millis: ${SESSION_RENEW_THRESHOLD_MILLIS:1800000}

minio:
  endpoint: ${MINIO_ENDPOINT:}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:}
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  bucket-name: ${MINIO_BUCKET_NAME:mypan}
  base-prefix: ${MINIO_BASE_PREFIX:file/}
  auto-create-bucket: ${MINIO_AUTO_CREATE_BUCKET:true}

storage:
  type: ${STORAGE_TYPE:local}